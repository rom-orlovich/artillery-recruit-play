<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>בדיקת גרפיקה</title>
  <style>
    body { margin: 0; background: #222; color: #fff; font: 18px sans-serif; }
    canvas { width: 160px; height: 160px; display: block; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px; direction: ltr; font-size: 14px; }
    pre { white-space: pre-wrap; direction: ltr; text-align: left; padding: 8px; font-size: 30px; font-weight: bold; line-height: 1.3; }
  </style>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
  <pre id="report">טוען…</pre>
  <div class="grid" id="grid"></div>
  <script type="module">
    import * as THREE from 'three';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
    import { createEnvManager } from './src/world-sky-env.js';
    import { createSplat, createTerrainMaterial } from './src/world-ground.js';
    import { loadWorldTexture } from './src/props/materials.js';
    import { loadDoherTemplate } from './src/world-doher.js';

    const CANVAS_SIZE = 160;
    const BLACK_MAX = 20;
    const WHITE_MIN = 235;
    const GROUND_SIZE = 40;
    const GROUND_SHADE = 0.95;
    const TEXTURE_TIMEOUT_MS = 15000;
    const TEXTURE_POLL_MS = 100;
    const TERRAIN_TEXTURE_UNIFORMS = ['tSand', 'tGrass', 'tStraw', 'tDirt', 'tRock'];
    const WORLD_TEXTURE_NAMES = ['dense_sand', 'sparse_grass', 'withered_grass', 'road_damaged', 'dark_rock_02'];
    const report = document.getElementById('report');
    const grid = document.getElementById('grid');
    const lines = [];
    const log = (text) => { lines.push(text); report.textContent = lines.join('\n'); };
    window.addEventListener('error', (event) => log('ERROR ' + event.message));
    window.addEventListener('unhandledrejection', (event) => log('ERROR ' + (event.reason && event.reason.message || event.reason)));
    const originalConsoleError = console.error;
    console.error = (...args) => { log('CONSOLE ' + args.join(' ').slice(0, 400)); originalConsoleError(...args); };

    const skyUniforms = {
      zenith: { value: new THREE.Color('#5d86b8') }, horizon: { value: new THREE.Color('#d9dde0') },
      horizonAway: { value: new THREE.Color('#c0ccd8') }, groundCol: { value: new THREE.Color('#8a7a60') },
      sunColor: { value: new THREE.Color('#fff2dc') }, sunDir: { value: new THREE.Vector3(0.6, 0.5, 0.3).normalize() },
      clouds: { value: 0.3 }, rays: { value: 0 }, stars: { value: 0 }
    };

    function createCase(name) {
      const cell = document.createElement('div');
      const canvas = document.createElement('canvas');
      cell.append(canvas, name);
      grid.append(cell);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
      renderer.setSize(CANVAS_SIZE, CANVAS_SIZE, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.debug.onShaderError = (gl, program, vertexShader, fragmentShader) => {
        log('SHADER ERROR in ' + name + ': ' + (gl.getProgramInfoLog(program) || '').slice(0, 300) + ' ' + (gl.getShaderInfoLog(fragmentShader) || '').slice(0, 300));
      };
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87a0c0);
      scene.add(new THREE.HemisphereLight(0xc8d4e6, 0x6c5c4a, 1.2));
      const sun = new THREE.DirectionalLight(0xffffff, 2);
      sun.position.set(3, 5, 4);
      scene.add(sun);
      const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
      return { name, renderer, scene, camera };
    }

    function report3(testCase) {
      const { name, renderer, scene, camera } = testCase;
      renderer.render(scene, camera);
      const gl = renderer.getContext();
      const pixel = new Uint8Array(4);
      gl.readPixels(CANVAS_SIZE / 2, CANVAS_SIZE / 2, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
      const [r, g, b] = pixel;
      const verdict = Math.max(r, g, b) < BLACK_MAX ? 'BLACK' : Math.min(r, g, b) > WHITE_MIN ? 'WHITE' : 'OK';
      log(`${name}: ${r},${g},${b} → ${verdict}`);
    }

    function addSkyEnv(testCase) {
      createEnvManager(testCase.scene, testCase.renderer).syncEnvMap(8, skyUniforms);
    }

    function addRoomEnv(testCase) {
      testCase.scene.environment = new THREE.PMREMGenerator(testCase.renderer).fromScene(new RoomEnvironment(), 0.04).texture;
    }

    function makeGround(withColor) {
      const geometry = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 8, 8);
      geometry.rotateX(-Math.PI / 2);
      if (withColor) {
        geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(geometry.attributes.position.count * 3).fill(GROUND_SHADE), 3));
      }
      return geometry;
    }

    function lookDown(camera) {
      camera.position.set(0, 12, 0.01);
      camera.lookAt(0, 0, 0);
    }

    function lookAtGun(camera) {
      camera.position.set(8, 5, 12);
      camera.lookAt(0, 1.5, 0);
    }

    function addGround(testCase, material, withColor) {
      testCase.scene.add(new THREE.Mesh(makeGround(withColor), material));
      lookDown(testCase.camera);
    }

    function addBox(testCase, material) {
      const box = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.4, 2.4), material);
      box.rotation.set(0.4, 0.6, 0);
      testCase.scene.add(box);
      testCase.camera.position.set(0, 0, 7);
    }

    function describeGpu() {
      const probe = createCase('probe');
      const gl = probe.renderer.getContext();
      const info = gl.getExtension('WEBGL_debug_renderer_info');
      log('GPU: ' + (info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : 'unknown'));
      log('MAX_TEXTURE_IMAGE_UNITS: ' + gl.getParameter(gl.MAX_TEXTURE_IMAGE_UNITS));
      const precision = gl.getShaderPrecisionFormat(gl.FRAGMENT_SHADER, gl.HIGH_FLOAT);
      log('fragment highp float: precision ' + (precision && precision.precision) + ' rangeMax ' + (precision && precision.rangeMax));
      log('float RT: ' + Boolean(gl.getExtension('EXT_color_buffer_float')) + ' half RT: ' + Boolean(gl.getExtension('EXT_color_buffer_half_float')));
      probe.renderer.dispose();
      probe.renderer.domElement.parentElement.remove();
    }

    function doherMeshes(template) {
      const meshes = [];
      template.traverse((node) => { if (node.isMesh) meshes.push(node); });
      return meshes;
    }

    function addDoher(testCase, template, materialFor) {
      const clone = template.clone(true);
      for (const mesh of doherMeshes(clone)) mesh.material = materialFor(mesh);
      testCase.scene.add(clone);
      lookAtGun(testCase.camera);
    }

    function guardedRun(name, build) {
      try {
        const testCase = createCase(name);
        const finish = build(testCase);
        if (finish instanceof Promise) return finish.then(() => report3(testCase)).catch((error) => log(name + ': ERROR ' + error.message));
        report3(testCase);
      } catch (error) {
        log(name + ': ERROR ' + error.message);
      }
      return Promise.resolve();
    }

    async function waitForTextures() {
      const textures = WORLD_TEXTURE_NAMES.map((name) => [name, loadWorldTexture(name)]);
      const deadline = Date.now() + TEXTURE_TIMEOUT_MS;
      const isLoaded = ([, texture]) => Boolean(texture.image && texture.image.width > 0);
      while (!textures.every(isLoaded) && Date.now() < deadline) {
        await new Promise((resolve) => setTimeout(resolve, TEXTURE_POLL_MS));
      }
      for (const entry of textures) {
        const [name, texture] = entry;
        log(`texture ${name}: ${isLoaded(entry) ? 'loaded ' + texture.image.width + 'x' + texture.image.height : 'FAILED/timeout'}`);
      }
    }

    function whiteTerrainMaterial(splatTexture) {
      const material = createTerrainMaterial(splatTexture, 'shivta');
      const original = material.onBeforeCompile;
      const white = new THREE.DataTexture(new Uint8Array([255, 255, 255, 255]), 1, 1, THREE.RGBAFormat);
      white.needsUpdate = true;
      material.onBeforeCompile = (shader, renderer) => {
        original(shader, renderer);
        for (const uniformName of TERRAIN_TEXTURE_UNIFORMS) shader.uniforms[uniformName] = { value: white };
      };
      return material;
    }

    function floatVertexColors(template) {
      const clone = template.clone(true);
      for (const mesh of doherMeshes(clone)) {
        const source = mesh.geometry.attributes.color;
        if (!source) continue;
        const values = new Float32Array(source.count * 4);
        for (let index = 0; index < source.count; index++) {
          values[index * 4] = source.getX(index);
          values[index * 4 + 1] = source.getY(index);
          values[index * 4 + 2] = source.getZ(index);
          values[index * 4 + 3] = source.itemSize > 3 ? source.getW(index) : 1;
        }
        mesh.geometry = mesh.geometry.clone();
        mesh.geometry.setAttribute('color', new THREE.BufferAttribute(values, 4));
      }
      return clone;
    }

    describeGpu();
    const splat = createSplat('shivta');
    await waitForTextures();
    const template = await loadDoherTemplate();
    if (!template) log('doher.glb failed to load');
    const plainStandard = () => new THREE.MeshStandardMaterial({ color: 0xd8c8a8, roughness: 0.9, metalness: 0 });

    await guardedRun('A sky-env', (c) => { addSkyEnv(c); addBox(c, plainStandard()); });
    await guardedRun('B room-env', (c) => { addRoomEnv(c); addBox(c, plainStandard()); });
    await guardedRun('C no-env', (c) => addBox(c, plainStandard()));
    await guardedRun('D lambert', (c) => addBox(c, new THREE.MeshLambertMaterial({ color: 0xd8c8a8 })));
    await guardedRun('E terrain', (c) => addGround(c, createTerrainMaterial(splat.texture, 'shivta'), true));
    await guardedRun('F terrain-no-vc', (c) => {
      const material = createTerrainMaterial(splat.texture, 'shivta');
      material.vertexColors = false;
      addGround(c, material, false);
    });
    await guardedRun('G lambert-vc', (c) => addGround(c, new THREE.MeshLambertMaterial({ vertexColors: true }), true));
    await guardedRun('K terrain-white-tex', (c) => addGround(c, whiteTerrainMaterial(splat.texture), true));
    await guardedRun('M lambert-jpg', (c) => addBox(c, new THREE.MeshLambertMaterial({ map: loadWorldTexture('dense_sand') })));
    if (template) {
      const original = (mesh) => mesh.material;
      await guardedRun('H doher', (c) => { addSkyEnv(c); addDoher(c, template, original); });
      await guardedRun('I doher-no-env', (c) => addDoher(c, template, original));
      await guardedRun('L doher-float-vc', (c) => {
        addSkyEnv(c);
        const converted = floatVertexColors(template);
        c.scene.add(converted);
        lookAtGun(c.camera);
      });
      await guardedRun('J doher-no-vc', (c) => addDoher(c, template, () => new THREE.MeshStandardMaterial({ color: 0x6a7a5a, roughness: 0.85, metalness: 0.1 })));
    }
    log('צלם מסך ושלח');
  </script>
</body>
</html>
